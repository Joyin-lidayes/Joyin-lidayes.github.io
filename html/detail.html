<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e6e8eb">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="jar游戏小站">
    <meta property="og:title" content="jar游戏小站">
    <meta property="og:description" content="专注塞班Java(jar)怀旧手机游戏下载，收录15000+款诺基亚时代游戏。">
    <meta property="og:image" content="https://joyin-lidayes.github.io/img/og-image.png">
    <meta property="og:url" content="https://joyin-lidayes.github.io/html/detail.html">
    <title>游戏详情</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/detail.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="../index.html">
                <span class="logo">J</span>
                <span>jar游戏小站</span>
            </a>
            <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links">
                <a href="../index.html">首页</a>
                <a href="friend.html">友链</a>
                <a href="QandA.html">Q&amp;A</a>
                <a href="donation.html">捐赠</a>
            </nav>
        </div>
    </header>

    <main class="container detail-page">
        <a id="backToGames" class="back-link" href="../index.html#games" aria-label="返回游戏列表">
            <span aria-hidden="true">←</span> 返回游戏列表
        </a>

        <article class="card detail-card">
            <header class="game-hero">
                <div class="game-icon-wrap is-loading" id="gameIconWrap" aria-busy="true">
                    <span class="game-icon-loader" aria-hidden="true"></span>
                    <img id="gameImg" alt="游戏封面">
                </div>
                <div class="game-summary">
                    <div class="game-title-line">
                        <h1 id="gameTitle"><span id="gameName">游戏详情</span></h1>
                        <span id="gameTypeTag" class="format-tag" hidden></span>
                    </div>
                    <p class="game-subtitle">塞班 Java 怀旧手机游戏</p>
                    <div class="game-actions">
                        <a id="download" class="btn btn-primary" href="#" target="_blank" rel="noopener">↓ 立即下载</a>
                        <button id="shareBtn" class="btn" type="button">↗ 分享游戏</button>
                    </div>
                </div>
            </header>

            <div class="detail-content">
                <section class="detail-section intro-section" aria-labelledby="introHeading">
                    <h2 id="introHeading">游戏简介</h2>
                    <p id="intro">暂无简介</p>
                </section>

                <aside class="detail-section game-info" aria-labelledby="infoHeading">
                    <h2 id="infoHeading">游戏信息</h2>
                    <dl class="info-list">
                        <div class="info-row">
                            <dt>
                                <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
                                贡献者
                            </dt>
                            <dd id="contributor">暂无详细信息</dd>
                        </div>
                        <div class="info-row">
                            <dt>
                                <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5 13.5 10.5M7.4 16.6l-1.2 1.2a3.5 3.5 0 0 1-5-5L5.5 8.5a3.5 3.5 0 0 1 5 0M16.6 7.4l1.2-1.2a3.5 3.5 0 0 1 5 5l-4.3 4.3a3.5 3.5 0 0 1-5 0" /></svg>
                                下载来源
                            </dt>
                            <dd id="source">暂无详细信息</dd>
                        </div>
                        <div id="extractCodeRow" class="info-row extract-code-row" hidden>
                            <dt>
                                <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" /></svg>
                                提取码
                            </dt>
                            <dd class="code-line">
                                <code id="extractCode"></code>
                                <button id="copyCodeBtn" class="copy-code-btn" type="button">复制</button>
                            </dd>
                        </div>
                    </dl>
                </aside>
            </div>
        </article>

        <p class="foot-note">
            <a href="https://qm.qq.com/cgi-bin/qm/qr?k=xBHI7DQ8itJeqWzgngV4oqzfT1dfhOuc&jump_from=webapi" target="_blank" rel="noopener">信息有误？联系我补充或修正</a>
        </p>
    </main>

    <footer class="site-footer">
        <p>© Joyin · jar游戏小站 · <a href="../index.html">返回首页</a></p>
    </footer>

    <script src="../js/common.js"></script>
    <script src="../js/detail.js"></script>
</body>

</html>
